<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supramemory</title>
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/graph.css">
</head>
<body>
  <div id="app">
    <!-- Top bar con búsqueda + filtros -->
    <header id="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">Supramemory</span>
      </div>
      <div class="search-wrap">
        <input
          id="search-input"
          type="text"
          placeholder="Buscar nodo, tag, texto... (presiona Enter para resaltar)"
          autocomplete="off"
        />
      </div>
      <div class="filters">
        <select id="filter-source">
          <option value="">Todos los orígenes</option>
        </select>
        <select id="filter-tag">
          <option value="">Todos los tags</option>
        </select>
      </div>
    </header>

    <!-- Canvas del grafo fullscreen -->
    <main id="graph-container">
      <svg id="graph-svg">
        <g id="graph-root"></g>
      </svg>
    </main>

    <!-- Panel lateral: detalle del nodo seleccionado -->
    <aside id="side-panel" class="collapsed">
      <button id="close-panel" title="Cerrar">×</button>
      <div id="panel-content"></div>
    </aside>

    <!-- Leyenda discreta -->
    <div id="legend">
      <div class="legend-title">Leyenda</div>
      <div id="legend-items"></div>
    </div>

    <!-- Status bar inferior -->
    <footer id="statusbar">
      <span id="status-count">0 nodos</span>
      <span class="sep">·</span>
      <span id="status-selected">Nada seleccionado</span>
      <span class="sep">·</span>
      <span class="hint">Click fija · Doble-click libera · Rueda = zoom · Drag vacío = pan</span>
    </footer>
  </div>

  <!-- D3 v7 desde CDN (versión fija para reproducibilidad) -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/filters.js"></script>
  <script src="/static/js/graph.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
